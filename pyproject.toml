[project]
name = "stashify"
version = "0.2.0"
description = "Privacy-focused CLI storage system using third-party platforms as encrypted backends"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "cryptography>=49.0",
    "click>=8.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlite-utils>=3.37",
    "tqdm>=4.70.0",
    "structlog>=24.1",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "rich>=13.0",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "mypy>=2.3.1",
    "pre-commit>=3.7",
]
test = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "hypothesis>=6.100",
]

[project.scripts]
stash = "stash.cli:main"

[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["stash*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "T20", "ARG", "PTH", "ERA", "PD", "PL", "TRY", "NPY", "RSE", "RET"]
ignore = [
    "S101", "S106", "S311", "B008",
    "TRY003", "PLR2004", "PLR0913", "PLR0917", "PLR0912", "PLR0915", "PLR0911",
    "ARG002", "E741", "ARG001", "PLC0415", "E402", "E501", "TRY300", "PLR0911",
]
fixable = ["ALL"]
unfixable = ["T20", "ARG001", "ARG002"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
strict = true
namespace_packages = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src/stash"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
fail_under = 25